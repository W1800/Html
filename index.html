<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Phone Guard</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

background:#07090d;

color:white;

font-family:Arial,sans-serif;

display:flex;

justify-content:center;

align-items:center;

padding:18px;

}

.app{

width:100%;

max-width:760px;

text-align:center;

}

h1{

margin:0 0 8px;

font-size:30px;

}

.description{

color:#aeb5c2;

margin:0 0 18px;

}

.camera{

position:relative;

width:100%;

aspect-ratio:16/10;

background:#000;

border-radius:20px;

overflow:hidden;

border:2px solid #292f3a;

}

video{

position:absolute;

inset:0;

width:100%;

height:100%;

object-fit:cover;

transform:scaleX(-1);

}

canvas{

position:absolute;

inset:0;

width:100%;

height:100%;

pointer-events:none;

}

.status{

margin-top:15px;

padding:18px;

border-radius:15px;

background:#12351f;

border:1px solid #2c6b40;

transition:.2s;

}

.status.alarm{

background:#461416;

border-color:#ff3030;

animation:alarmFlash .5s infinite alternate;

}

.title{

font-size:24px;

font-weight:bold;

}

.text{

margin-top:7px;

color:#d0d5dd;

}

button{

margin-top:15px;

padding:14px 26px;

border:0;

border-radius:12px;

background:white;

color:#111;

font-size:17px;

font-weight:bold;

cursor:pointer;

}

button:disabled{

opacity:.5;

}

.loading{

margin-top:12px;

font-size:14px;

color:#aeb5c2;

}

@keyframes alarmFlash{

from{

transform:scale(1);

}

to{

transform:scale(1.02);

}

}

</style>

</head>


<body>


<div class="app">


<h1>📱 Phone Guard</h1>


<p class="description">

إذا اقترب الجوال من أذنك يصدر النظام إنذارًا.

</p>


<div class="camera">

<video
id="camera"
autoplay
muted
playsinline>
</video>


<canvas id="overlay"></canvas>

</div>


<div
id="status"
class="status">

<div
id="statusTitle"
class="title">

🟢 الوضع الطبيعي

</div>


<div
id="statusText"
class="text">

اضغط بدء المراقبة.

</div>

</div>


<button
id="startButton">

بدء المراقبة

</button>


<div
id="loading"
class="loading">
</div>


</div>


<!-- TensorFlow -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>


<!-- COCO SSD -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>


<!-- MediaPipe Face Mesh -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script>


const video =
document.getElementById("camera");


const canvas =
document.getElementById("overlay");


const ctx =
canvas.getContext("2d");


const startButton =
document.getElementById("startButton");


const statusBox =
document.getElementById("status");


const statusTitle =
document.getElementById("statusTitle");


const statusText =
document.getElementById("statusText");


const loading =
document.getElementById("loading");


let phoneModel = null;

let faceMesh = null;

let stream = null;

let running = false;

let processing = false;

let lastFace = null;

let alarmActive = false;

let nearFrames = 0;

let safeFrames = 0;


/* ==========================
   الحالة الطبيعية
========================== */

function normalStatus(message){

statusBox.classList.remove("alarm");

statusTitle.textContent =
"🟢 الوضع الطبيعي";

statusText.textContent =
message;

}


/* ==========================
   الإنذار
========================== */

function alarmStatus(){

statusBox.classList.add("alarm");

statusTitle.textContent =
"🚨 إنذار!";

statusText.textContent =
"الجوال قريب من أذنك — أبعد الجوال.";

}


/* ==========================
   صوت الإنذار
========================== */

function alarmSound(){

const AudioContext =
window.AudioContext ||
window.webkitAudioContext;

if(!AudioContext){

return;

}

const audio =
new AudioContext();

const oscillator =
audio.createOscillator();

const gain =
audio.createGain();


oscillator.type =
"square";


oscillator.frequency.setValueAtTime(
850,
audio.currentTime
);


oscillator.frequency.setValueAtTime(
1050,
audio.currentTime + 0.18
);


gain.gain.setValueAtTime(
0.0001,
audio.currentTime
);


gain.gain.exponentialRampToValueAtTime(
0.2,
audio.currentTime + 0.03
);


gain.gain.exponentialRampToValueAtTime(
0.0001,
audio.currentTime + 0.45
);


oscillator.connect(gain);

gain.connect(audio.destination);


oscillator.start();

oscillator.stop(
audio.currentTime + 0.5
);


setTimeout(
()=>{
audio.close();
},
700
);

}


/* ==========================
   صوت الرجوع للطبيعي
========================== */

function safeSound(){

const AudioContext =
window.AudioContext ||
window.webkitAudioContext;

if(!AudioContext){

return;

}

const audio =
new AudioContext();

const oscillator =
audio.createOscillator();

const gain =
audio.createGain();


oscillator.type =
"sine";


oscillator.frequency.value =
440;


gain.gain.value =
0.06;


oscillator.connect(gain);

gain.connect(audio.destination);


oscillator.start();

oscillator.stop(
audio.currentTime + 0.2
);


setTimeout(
()=>{
audio.close();
},
500
);

}


/* ==========================
   اهتزاز
========================== */

function vibrate(){

if(
navigator.vibrate
){

navigator.vibrate([
250,
100,
250,
100,
450
]);

}

}


/* ==========================
   تشغيل الإنذار
========================== */

function activateAlarm(){

if(alarmActive){

return;

}

alarmActive =
true;

alarmStatus();

alarmSound();

vibrate();

}


/* ==========================
   إيقاف الإنذار
========================== */

function deactivateAlarm(){

if(!alarmActive){

return;

}

alarmActive =
false;

safeSound();

normalStatus(
"الجوال بعيد عن الأذن."
);

}


/* ==========================
   الحصول على نقطة
========================== */

function point(
landmark
){

return{

x:
landmark.x *
canvas.width,

y:
landmark.y *
canvas.height

};

}


/* ==========================
   حساب المسافة
========================== */

function distance(
a,
b
){

return Math.sqrt(

Math.pow(
a.x-b.x,
2
)

+

Math.pow(
a.y-b.y,
2
)

);

}


/* ==========================
   تحديد الأذن
========================== */

function getEarPoints(
landmarks
){

/*

MediaPipe Face Mesh

نقاط جانبي الوجه:

234 = جانب الوجه الأيسر

454 = جانب الوجه الأيمن

127 = منطقة الصدغ اليسرى

356 = منطقة الصدغ اليمنى

*/

const leftSide =
point(
landmarks[234]
);


const rightSide =
point(
landmarks[454]
);


const leftTemple =
point(
landmarks[127]
);


const rightTemple =
point(
landmarks[356]
);


/*

نحسب نقطة تقريبية
لمركز منطقة الأذن.

*/

const leftEar = {

x:
(leftSide.x * 0.65) +
(leftTemple.x * 0.35),

y:
(leftSide.y * 0.65) +
(leftTemple.y * 0.35)

};


const rightEar = {

x:
(rightSide.x * 0.65) +
(rightTemple.x * 0.35),

y:
(rightSide.y * 0.65) +
(rightTemple.y * 0.35)

};


return{

left:leftEar,

right:rightEar

};

}


/* ==========================
   التحقق من الجوال
========================== */

function phoneNearEar(
phone,
landmarks
){

if(
!phone ||
!landmarks
){

return false;

}


const phoneCenter = {

x:
phone[0] +
phone[2]/2,

y:
phone[1] +
phone[3]/2

};


const ears =
getEarPoints(
landmarks
);


const dLeft =
distance(
phoneCenter,
ears.left
);


const dRight =
distance(
phoneCenter,
ears.right
);


const faceWidth =
Math.abs(

point(
landmarks[454]
).x

-

point(
landmarks[234]
).x

);


/*

نسبة المسافة إلى حجم الوجه.

*/

const normalizedLeft =
dLeft /
faceWidth;


const normalizedRight =
dRight /
faceWidth;


const nearest =
Math.min(
normalizedLeft,
normalizedRight
);


/*

يعتبر الجوال قريبًا
إذا كان ضمن هذه المنطقة.

*/

return nearest < 0.38;

}


/* ==========================
   رسم منطقة الأذن
========================== */

function drawEarPoint(
p,
color
){

ctx.beginPath();

ctx.arc(
p.x,
p.y,
9,
0,
Math.PI*2
);

ctx.fillStyle =
color;

ctx.fill();

}


/* ==========================
   MediaPipe
========================== */

function onFaceResults(
results
){

if(
!results.multiFaceLandmarks ||
results.multiFaceLandmarks.length === 0
){

lastFace =
null;

return;

}


lastFace =
results.multiFaceLandmarks[0];

}


/* ==========================
   التحليل
========================== */

async function analyze(){

if(
!running ||
processing
){

return;

}


processing =
true;


try{


const predictions =
await phoneModel.detect(
video,
8
);


const phones =
predictions.filter(
item =>

item.class ===
"cell phone"

&&

item.score >=
0.40
);


let phone =
null;


if(
phones.length
){

phones.sort(
(a,b)=>
b.score-a.score
);

phone =
phones[0].bbox;

}


/*

إرسال الصورة إلى
Face Mesh.

*/

await faceMesh.send({
image:video
});


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


if(
lastFace
){

const ears =
getEarPoints(
lastFace
);


drawEarPoint(
ears.left,
"#00ff88"
);


drawEarPoint(
ears.right,
"#00ff88"
);


if(
phone
){

const near =
phoneNearEar(
phone,
lastFace
);


ctx.strokeStyle =
near
?
"#ff2222"
:
"#ffff00";


ctx.lineWidth =
5;


ctx.strokeRect(
phone[0],
phone[1],
phone[2],
phone[3]
);


if(
near
){

nearFrames++;

safeFrames =
0;


if(
nearFrames >= 4
){

activateAlarm();

}


normalStatus(
"⚠️ الجوال يقترب من منطقة الأذن..."
);


if(
alarmActive
){

alarmStatus();

}


}else{

nearFrames =
Math.max(
0,
nearFrames-1
);

safeFrames++;


if(
safeFrames >= 5
){

deactivateAlarm();

normalStatus(
"🟢 الجوال بعيد عن الأذن."
);

}

}

}else{

safeFrames++;

nearFrames =
0;


deactivateAlarm();


normalStatus(
"🟢 الوضع طبيعي — الجوال غير ظاهر."
);

}

}else{

safeFrames++;

nearFrames =
0;


deactivateAlarm();


normalStatus(
"🟢 الوجه غير واضح. اجعل وجهك والجوال ظاهرين."
);

}


}catch(error){

console.error(
error
);

}


processing =
false;


if(running){

setTimeout(
analyze,
180
);

}

}


/* ==========================
   بدء الكاميرا
========================== */

async function startSystem(){

if(running){

return;

}


try{


startButton.disabled =
true;


loading.textContent =
"جارٍ تشغيل الكاميرا...";


stream =
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:
"user",

width:{
ideal:1280
},

height:{
ideal:720
}

},

audio:false

});


video.srcObject =
stream;


await video.play();


canvas.width =
video.videoWidth ||
1280;


canvas.height =
video.videoHeight ||
720;


/*

تحميل نموذج الجوال.

*/

loading.textContent =
"جارٍ تحميل نظام اكتشاف الجوال...";


phoneModel =
await cocoSsd.load();


/*

تشغيل Face Mesh.

*/

loading.textContent =
"جارٍ تحميل نظام تحديد الوجه والأذن...";


faceMesh =
new FaceMesh({

locateFile:
file =>
`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`

});


faceMesh.setOptions({

maxNumFaces:1,

refineLandmarks:true,

minDetectionConfidence:0.6,

minTrackingConfidence:0.6

});


faceMesh.onResults(
onFaceResults
);


running =
true;


loading.textContent =
"النظام يعمل.";


startButton.textContent =
"المراقبة تعمل";


normalStatus(
"🟢 وجّه الكاميرا نحو وجهك والجوال."
);


analyze();


}catch(error){

console.error(
error
);


startButton.disabled =
false;


loading.textContent =
"تعذر تشغيل النظام.";


if(
error.name ===
"NotAllowedError"
){

normalStatus(
"يجب السماح للموقع باستخدام الكاميرا."
);

}else{

normalStatus(
"حدث خطأ أثناء تشغيل الكاميرا."
);

}

}

}


/* ==========================
   زر البداية
========================== */

startButton.addEventListener(
"click",
startSystem
);


</script>


</body>

</html>
