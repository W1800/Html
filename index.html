<script>

"use strict";


/* =====================================================
   العناصر
===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const statusBox =
document.getElementById("status");

const statusTitle =
document.getElementById("statusTitle");

const statusText =
document.getElementById("statusText");

const logBox =
document.getElementById("log");

const phoneState =
document.getElementById("phoneState");

const faceState =
document.getElementById("faceState");

const handState =
document.getElementById("handState");

const earState =
document.getElementById("earState");


/* =====================================================
   المتغيرات
===================================================== */

let stream = null;

let phoneModel = null;

let faceLandmarker = null;

let handLandmarker = null;

let running = false;

let loopId = null;

let lastRun = 0;

let mediaPipeModule = null;

let alarmActive = false;

let nearCounter = 0;

let awayCounter = 0;

let loadingModels = false;


/* =====================================================
   إعدادات الكشف
===================================================== */

const PHONE_MIN_SCORE = 0.55;

const EAR_DISTANCE_LIMIT = 0.34;

const HAND_DISTANCE_LIMIT = 2.5;

const REQUIRED_NEAR_FRAMES = 6;

const REQUIRED_AWAY_FRAMES = 5;

const DETECTION_INTERVAL = 120;


/* =====================================================
   نقاط الوجه
===================================================== */

const LEFT_SIDE = 234;

const RIGHT_SIDE = 454;

const LEFT_TOP = 127;

const RIGHT_TOP = 356;

const FACE_TOP = 10;

const FACE_BOTTOM = 152;


/* =====================================================
   أصابع اليد
===================================================== */

const FINGERTIPS = [
    4,
    8,
    12,
    16,
    20
];


/* =====================================================
   تغيير الحالة
===================================================== */

function setStatus(title,text,alarm){

    statusTitle.textContent = title;

    statusText.textContent = text;

    statusBox.classList.toggle(
        "alarm",
        !!alarm
    );

}


/* =====================================================
   سجل النظام
===================================================== */

function log(message){

    logBox.textContent = message;

    console.log(
        "[Phone Guard]",
        message
    );

}


/* =====================================================
   صوت الإنذار
===================================================== */

function playAlarm(){

    if(alarmActive){
        return;
    }

    alarmActive = true;


    setStatus(
        "🚨 إنذار!",
        "تم تأكيد اقتراب الجوال من الأذن.",
        true
    );


    try{

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AudioContext){

            log(
                "المتصفح لا يدعم Web Audio."
            );

            return;
        }


        const audio =
        new AudioContext();


        const gain =
        audio.createGain();

        const osc1 =
        audio.createOscillator();

        const osc2 =
        audio.createOscillator();


        osc1.type =
        "sawtooth";

        osc2.type =
        "square";


        osc1.connect(gain);

        osc2.connect(gain);

        gain.connect(
            audio.destination
        );


        const now =
        audio.currentTime;


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            0.22,
            now + 0.05
        );


        for(
            let t=0;
            t<1.5;
            t+=0.15
        ){

            const high =
            Math.floor(
                t / 0.15
            ) % 2 === 0;


            osc1.frequency.setValueAtTime(
                high ? 1100 : 650,
                now+t
            );


            osc2.frequency.setValueAtTime(
                high ? 760 : 470,
                now+t
            );

        }


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now+1.5
        );


        osc1.start(now);

        osc2.start(now);

        osc1.stop(now+1.5);

        osc2.stop(now+1.5);


        setTimeout(
            function(){

                try{
                    audio.close();
                }
                catch(e){}

            },
            1700
        );


        if(
            navigator.vibrate
        ){

            navigator.vibrate([
                300,
                100,
                300,
                100,
                600
            ]);

        }

    }
    catch(error){

        log(
            "خطأ في الصوت: " +
            error.message
        );

    }

}


/* =====================================================
   إيقاف الإنذار
===================================================== */

function stopAlarm(){

    if(!alarmActive){
        return;
    }


    alarmActive = false;


    if(
        navigator.vibrate
    ){

        navigator.vibrate(0);

    }


    setStatus(
        "🟢 الوضع الطبيعي",
        "الجوال ابتعد عن منطقة الأذن.",
        false
    );

}


/* =====================================================
   تحميل MediaPipe فقط بعد الضغط
===================================================== */

async function loadMediaPipe(){

    if(mediaPipeModule){

        return mediaPipeModule;

    }


    log(
        "جارٍ تحميل MediaPipe..."
    );


    /*
       مهم:
       الاستيراد يحدث هنا وليس عند فتح الصفحة.
       إذا فشل فلن يموت زر المراقبة.
    */

    try{

        mediaPipeModule =
        await import(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs"
        );


        log(
            "تم تحميل مكتبة MediaPipe."
        );


        return mediaPipeModule;

    }
    catch(error){

        mediaPipeModule = null;


        throw new Error(
            "تعذر تحميل MediaPipe: " +
            error.message
        );

    }

}


/* =====================================================
   تحميل النماذج
===================================================== */

async function loadModels(){

    if(
        phoneModel &&
        faceLandmarker &&
        handLandmarker
    ){

        return;

    }


    if(loadingModels){
        return;
    }


    loadingModels = true;


    try{

        /* ---------------------------------------------
           TensorFlow
        --------------------------------------------- */

        log(
            "جارٍ تجهيز TensorFlow..."
        );


        if(
            typeof tf === "undefined"
        ){

            throw new Error(
                "TensorFlow.js لم يتم تحميله."
            );

        }


        await tf.ready();


        log(
            "TensorFlow جاهز."
        );


        /* ---------------------------------------------
           COCO SSD
        --------------------------------------------- */

        log(
            "جارٍ تحميل نموذج اكتشاف الجوال..."
        );


        if(
            typeof cocoSsd === "undefined"
        ){

            throw new Error(
                "COCO-SSD لم يتم تحميله."
            );

        }


        phoneModel =
        await cocoSsd.load({
            base:"lite_mobilenet_v2"
        });


        log(
            "تم تحميل نموذج الجوال."
        );


        /* ---------------------------------------------
           MediaPipe
        --------------------------------------------- */

        const mp =
        await loadMediaPipe();


        const FaceLandmarker =
        mp.FaceLandmarker;

        const HandLandmarker =
        mp.HandLandmarker;

        const FilesetResolver =
        mp.FilesetResolver;


        if(
            !FaceLandmarker ||
            !HandLandmarker ||
            !FilesetResolver
        ){

            throw new Error(
                "تعذر العثور على أدوات MediaPipe."
            );

        }


        log(
            "جارٍ تحميل محرك MediaPipe..."
        );


        const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


        /* ---------------------------------------------
           Face Landmarker
        --------------------------------------------- */

        log(
            "جارٍ تحميل نموذج الوجه..."
        );


        faceLandmarker =
        await FaceLandmarker.createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate:"GPU"

                },

                runningMode:"VIDEO",

                numFaces:1,

                minFaceDetectionConfidence:0.5,

                minFacePresenceConfidence:0.5,

                minTrackingConfidence:0.5

            }

        );


        log(
            "تم تحميل نموذج الوجه."
        );


        /* ---------------------------------------------
           Hand Landmarker
        --------------------------------------------- */

        log(
            "جارٍ تحميل نموذج اليد..."
        );


        handLandmarker =
        await HandLandmarker.createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:"GPU"

                },

                runningMode:"VIDEO",

                numHands:2,

                minHandDetectionConfidence:0.5,

                minHandPresenceConfidence:0.5,

                minTrackingConfidence:0.5

            }

        );


        log(
            "✅ تم تحميل جميع نماذج الذكاء الاصطناعي."
        );


    }
    catch(error){

        phoneModel = null;

        faceLandmarker = null;

        handLandmarker = null;


        throw error;

    }
    finally{

        loadingModels = false;

    }

}


/* =====================================================
   المسافة
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   حساب منطقة الأذن
===================================================== */

function getEarPositions(
    landmarks
){

    const left =
    landmarks[LEFT_SIDE];

    const right =
    landmarks[RIGHT_SIDE];

    const leftTop =
    landmarks[LEFT_TOP];

    const rightTop =
    landmarks[RIGHT_TOP];


    if(
        !left ||
        !right ||
        !leftTop ||
        !rightTop
    ){

        return null;

    }


    const leftEar = {

        x:
        left.x * 0.72 +
        leftTop.x * 0.28,

        y:
        left.y * 0.72 +
        leftTop.y * 0.28

    };


    const rightEar = {

        x:
        right.x * 0.72 +
        rightTop.x * 0.28,

        y:
        right.y * 0.72 +
        rightTop.y * 0.28

    };


    const faceWidth =
    distance(
        left,
        right
    );


    return {

        left:leftEar,

        right:rightEar,

        faceWidth:faceWidth

    };

}


/* =====================================================
   المسافة بين الجوال والأذن
===================================================== */

function getEarDistance(
    bbox,
    landmarks
){

    const ears =
    getEarPositions(
        landmarks
    );


    if(!ears){
        return null;
    }


    const phoneCenter = {

        x:
        (
            bbox[0] +
            bbox[2]/2
        ) / canvas.width,

        y:
        (
            bbox[1] +
            bbox[3]/2
        ) / canvas.height

    };


    const left =
    distance(
        phoneCenter,
        ears.left
    );


    const right =
    distance(
        phoneCenter,
        ears.right
    );


    const nearest =
    Math.min(
        left,
        right
    );


    const normalized =
    nearest /
    Math.max(
        ears.faceWidth,
        0.001
    );


    return {

        normalized:normalized,

        left:left,

        right:right

    };

}


/* =====================================================
   هل اليد تمسك الجوال؟
===================================================== */

function isPhoneNearHand(
    bbox,
    hands
){

    if(
        !hands ||
        hands.length === 0
    ){

        return false;

    }


    const phoneCenter = {

        x:
        bbox[0] +
        bbox[2]/2,

        y:
        bbox[1] +
        bbox[3]/2

    };


    const phoneSize =
    Math.sqrt(
        bbox[2] *
        bbox[3]
    );


    let closest =
    Infinity;


    for(
        const hand of hands
    ){

        for(
            const index of FINGERTIPS
        ){

            const p =
            hand[index];


            if(!p){
                continue;
            }


            const finger = {

                x:
                p.x *
                canvas.width,

                y:
                p.y *
                canvas.height

            };


            const d =
            distance(
                phoneCenter,
                finger
            );


            if(
                d < closest
            ){

                closest = d;

            }

        }

    }


    return (
        closest /
        Math.max(
            phoneSize,
            1
        )
    ) < HAND_DISTANCE_LIMIT;

}


/* =====================================================
   رسم نقطة
===================================================== */

function drawPoint(
    x,
    y,
    color,
    radius
){

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius || 5,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
    color;

    ctx.fill();

}


/* =====================================================
   رسم الوجه
===================================================== */

function drawFace(
    landmarks
){

    const indexes = [

        LEFT_SIDE,
        RIGHT_SIDE,
        LEFT_TOP,
        RIGHT_TOP

    ];


    for(
        const index of indexes
    ){

        const p =
        landmarks[index];


        if(!p){
            continue;
        }


        drawPoint(
            p.x*canvas.width,
            p.y*canvas.height,
            "#37ff88",
            5
        );

    }


    const ears =
    getEarPositions(
        landmarks
    );


    if(!ears){
        return;
    }


    drawPoint(
        ears.left.x *
        canvas.width,

        ears.left.y *
        canvas.height,

        "#00eaff",

        7
    );


    drawPoint(
        ears.right.x *
        canvas.width,

        ears.right.y *
        canvas.height,

        "#00eaff",

        7
    );

}


/* =====================================================
   رسم اليد
===================================================== */

function drawHands(
    hands
){

    if(!hands){
        return;
    }


    for(
        const hand of hands
    ){

        for(
            const index of FINGERTIPS
        ){

            const p =
            hand[index];


            if(!p){
                continue;
            }


            drawPoint(
                p.x *
                canvas.width,

                p.y *
                canvas.height,

                "#4d9cff",

                5 
            );

        }

    }

}


/* ============================
